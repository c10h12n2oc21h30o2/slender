# Slender — configuración
config-version: 3
world: slender

build:
  max-blocks-per-tick: 2000
  max-ms-per-tick: 15

game:
  pages: 8
  countdown-seconds: 20
  full-countdown-seconds: 5
  escape-seconds: 60          # mínimo; si la salida queda lejos de las páginas (instituto) se alarga solo
  end-seconds: 10
  batteries-per-game: 6
  coop:
    min-players: 1
    max-players: 8
    time-limit-seconds: 900
  asim:
    min-players: 3
    max-players: 9
    time-limit-seconds: 600

flashlight:
  range: 14
  battery-drain-per-second: 0.2
  battery-charge: 40

static:
  look-rate: 18
  look-half-angle: 30
  look-max-distance: 48
  proximity-rate: 25
  proximity-radius: 6
  decay-rate: 10

stamina:
  drain-per-second: 12.5
  regen-per-second: 8
  recover-at: 30

slender:
  # mannequin (entidad con forma de jugador y skin) o enderman
  body: mannequin
  scale: 1.45
  skin:
    # Lo más fácil: /slender skin <cuenta de Java comprada que lleve la skin puesta> (funciona en servidores offline)
    # Nombre de una cuenta de Minecraft con la skin que quieras para Slender
    player: ""
    # O la textura directamente (value + signature de la propiedad "textures")
    value: ""
    signature: ""
  observe-half-angle: 55
  observe-max-distance: 64
  catch-distance: 1.5

isolation:
  min-players-exclusive: 4
  radius: 25
  seconds: 40

asim:
  teleport-range: 40
  teleport-cooldown: 10
  whisper-range: 30
  whisper-cooldown: 15
  apparition-cooldown: 25
  blackout-cooldown: 40
  blackout-radius: 20
  blackout-ticks: 80
  grab-distance: 2.5
  grab-cooldown: 3
  cooldown-reduction-per-page: 0.05

# Estación de Valdemora (vestíbulo)
vestibulo:
  # Niebla: distancia de visión en la estación, en chunks (0 = sin niebla; 2 = la más espesa).
  # En las partidas va de 6 a 2 según las páginas.
  niebla: 2
  # Bruma baja de humo sobre el andén y las vías
  bruma: true

page-phrases:
  - "SIEMPRE MIRA"
  - "NO PUEDES CORRER"
  - "NO MIRES O TE LLEVA"
  - "ME SIGUE"
  - "NO ESTÁS SOLO"
  - "DETRÁS DE TI"
  - "NO HAY SALIDA"
  - "AYÚDAME"
  - "LOS ÁRBOLES OBSERVAN"
  - "NO GRITES"

# LA NOCHE ENTERA (modo historia de Hogwarts): ajustes de dificultad. Cambia y /slender reload.
noche:
  paginas-base: [3, 4, 5, 5, 6, 7, 8]     # páginas de cada fase con 2-3 jugadores
  factor-jugadores: {1: 0.75, 2: 1.0, 4: 1.25, 6: 1.5}   # a partir de N jugadores
  paginas-min: 2
  paginas-max: 12
  tiempo-base: 180          # segundos de cada fase…
  tiempo-por-pagina: 60     # …más estos por página
  agresividad-por-fase: 0.5
  huida-por-fase: 0.3
  estatica-por-fase: 0.08
  velas-inicio: 2
  velas-max: 4
  max-miembros: 8           # jugadores como mucho en una noche
  frecuencia-por-fase: 0.25
  luces: {radio: 12, min: 30, max: 60, pila-mirando: 6.0}
  correr: {umbral: 6.0, baja-por-fase: 0.5, distancia: 0.6}
  cabezas: {radio: 8, segundos: 20, coger: 2}
  fogonazo: {enfriamiento: 90, prob: 0.02, segundos: 3, estatica: 15}
  suplantar: {enfriamiento: 120, prob: 0.03, min: 15, max: 30, revela: 4, dura: 30, estatica: 30}
  perseguir: {radio: 20, prob: 0.35, velocidad: 3.5, dura: 8, enfriamiento: 30}
  caldero: {segundos: 8, radio: 3, enfriamiento: 60, pila: 50}
  snitch: {cada-min: 120, cada-max: 240, dura: 45, velocidad: 5.0, huye: 6, atrapa: 1.2}

