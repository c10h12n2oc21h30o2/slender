# Slender — configuración
config-version: 3
world: slender

build:
  max-blocks-per-tick: 2000
  max-ms-per-tick: 15

game:
  pages: 8
  countdown-seconds: 20
  full-countdown-seconds: 5
  escape-seconds: 60          # mínimo; si la salida queda lejos de las páginas (instituto) se alarga solo
  end-seconds: 10
  batteries-per-game: 6
  coop:
    min-players: 1
    max-players: 8
    time-limit-seconds: 900
  asim:
    min-players: 3
    max-players: 9
    time-limit-seconds: 600

flashlight:
  range: 14
  battery-drain-per-second: 0.2
  battery-charge: 40

static:
  look-rate: 18
  look-half-angle: 30
  look-max-distance: 48
  proximity-rate: 25
  proximity-radius: 6
  decay-rate: 10

stamina:
  drain-per-second: 12.5
  regen-per-second: 8
  recover-at: 30

slender:
  # mannequin (entidad con forma de jugador y skin) o enderman
  body: mannequin
  scale: 1.45
  skin:
    # Lo más fácil: /slender skin <cuenta de Java comprada que lleve la skin puesta> (funciona en servidores offline)
    # Nombre de una cuenta de Minecraft con la skin que quieras para Slender
    player: ""
    # O la textura directamente (value + signature de la propiedad "textures")
    value: ""
    signature: ""
  observe-half-angle: 55
  observe-max-distance: 64
  catch-distance: 1.5

isolation:
  min-players-exclusive: 4
  radius: 25
  seconds: 40

asim:
  teleport-range: 40
  teleport-cooldown: 10
  whisper-range: 30
  whisper-cooldown: 15
  apparition-cooldown: 25
  blackout-cooldown: 40
  blackout-radius: 20
  blackout-ticks: 80
  grab-distance: 2.5
  grab-cooldown: 3
  cooldown-reduction-per-page: 0.05

# Estación de Valdemora (vestíbulo)
vestibulo:
  # Niebla: distancia de visión en la estación, en chunks (0 = sin niebla; 2 = la más espesa).
  # En las partidas va de 6 a 2 según las páginas.
  niebla: 2
  # Bruma baja de humo sobre el andén y las vías
  bruma: true

page-phrases:
  - "SIEMPRE MIRA"
  - "NO PUEDES CORRER"
  - "NO MIRES O TE LLEVA"
  - "ME SIGUE"
  - "NO ESTÁS SOLO"
  - "DETRÁS DE TI"
  - "NO HAY SALIDA"
  - "AYÚDAME"
  - "LOS ÁRBOLES OBSERVAN"
  - "NO GRITES"

messages:
  prefix: "<dark_gray>[<dark_red>Slender</dark_red>]</dark_gray> "
  usage: "<gray>Uso: <white>/slender</white> (vestíbulo) · <white>/slender join <mapa> [coop|asim] | leave | list</white></gray>"
  no-permission: "<red>No tienes permiso.</red>"
  players-only: "<red>Solo un jugador puede usar esto.</red>"
  unknown-map: "<red>No existe el mapa <white>{map}</white>. Mapas: {maps}</red>"
  map-not-built: "<red>El mapa <white>{map}</white> no está generado. Un admin debe usar /slender build {map}.</red>"
  already-in-game: "<red>Ya estás en una partida. Usa /slender leave.</red>"
  not-in-game: "<red>No estás en ninguna partida.</red>"
  game-running: "<red>La partida de <white>{map}</white> ya ha empezado.</red>"
  game-full: "<red>La partida de <white>{map}</white> está llena.</red>"
  mode-forced: "<gray>La partida ya es en modo <white>{mode}</white>; entras en ese modo.</gray>"
  joined: "<gray>Has entrado en <white>{map}</white> (<white>{mode}</white>).</gray>"
  left: "<gray>Has salido de la partida.</gray>"
  player-joined: "<gray>{player} se ha unido <dark_gray>({count}/{max})</dark_gray></gray>"
